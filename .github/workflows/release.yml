name: Release

# Tag a version to publish it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json from this repo (owner, URLs, version)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const [owner, repo] = process.env.REPO.split("/");
            const v = process.env.VERSION;
            const base = `https://github.com/${owner}/${repo}`;
            const raw = `https://raw.githubusercontent.com/${owner}/${repo}/main`;
            m.version = v;
            m.authors = [{ name: owner }];
            m.url = base;
            m.readme = `${base}/blob/main/README.md`;
            m.changelog = `${base}/blob/main/CHANGELOG.md`;
            m.bugs = `${base}/issues`;
            m.license = `${base}/blob/main/LICENSE`;
            m.manifest = `${base}/releases/latest/download/module.json`;
            m.download = `${base}/releases/download/v${v}/module.zip`;
            m.flags = m.flags || {};
            m.flags.media = [
              { type: "cover", url: `${raw}/docs/dashboard.png` },
              { type: "screenshot", url: `${raw}/docs/dashboard.png`, caption: "GM dashboard: scene NPCs, with a collapsible off-scene group" },
              { type: "screenshot", url: `${raw}/docs/chat-card.png`, caption: "Official disposition-change card posted to chat" }
            ];
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles templates lang LICENSE README.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
